---
# Batched, so a routine action bump is one reviewable pull request rather than
# six. The major group is separate because those need reading rather than
# scanning.
version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: ci
    groups:
      actions-minor:
        update-types:
          - minor
          - patch
      actions-major:
        update-types:
          - major

  # uv owns pyproject.toml and uv.lock together, so the two can never be
  # updated apart and leave the lock describing something the project no longer
  # asks for.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: build
    groups:
      tooling:
        patterns:
          - "*"
