---
minor_changes:
  - the live-test credentials live in the project root and are git-ignored, as
    ``.tskey`` and ``.tskey-oauth``, with the admin key overridable through
    ``TS_KEY_FILE``. ``make live-stress`` defaults to them instead of requiring the
    variable exported, and ``make live-smoke`` prefers the OAuth file. A live run
    against a development tailnet needs the key set explicitly and the
    acknowledgement, and never reads the host's own ``tailscale`` configuration.
  - the ``Makefile`` keeps its scratch under ``.cache/scratch`` rather than the
    agent notes area, so a build or a drift check no longer depends on
    ``.agents/brain``.
